[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finshape3d"
version = "1.3.13"
description = "FinShape3D: Reconstruct 2D/3D dorsal fins from oblique photographs and ratio tables."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "Pillow",
    "openpyxl",
    "scipy",
    "open3d"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]
finfindr = [
    "torch>=2.3",
]
surface = [
    "shapely==2.1.2",
    "trimesh==4.11.2",
]
full = [
    "torch>=2.3",
    "shapely==2.1.2",
    "trimesh==4.11.2",
]

[project.urls]
Homepage = "https://github.com/emorteo/FinShape-Surfer"

[tool.setuptools]
py-modules = ["finshape2d", "finshape3d", "finshape_surfer_gui"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "core.*"]
exclude = ["baselines*", "data*", "outputs*", "references*", "tests*", "tools*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
